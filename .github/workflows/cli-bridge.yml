name: CLI bridge

# The CLI bridge is its own Cargo workspace, so the main Rust job does not build it.
on:
  pull_request:
    paths:
      - "examples/cli_bridge/**"
      - ".github/workflows/cli-bridge.yml"
      - "rust-toolchain.toml"
  push:
    branches: [main]
    paths:
      - "examples/cli_bridge/**"
      - ".github/workflows/cli-bridge.yml"
      - "rust-toolchain.toml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/cli_bridge
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust components
        run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: examples/cli_bridge
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --locked
