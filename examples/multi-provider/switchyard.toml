# Targets: one model on one client.

[targets.claude]
id = "claude-sonnet-5-5"
llm_client = "claude_subscription"

[targets.codex]
id = "gpt-5.6-sol"
llm_client = "codex_subscription"
# The ChatGPT Codex backend rejects some standard fields.
omit_body_fields = ["max_output_tokens", "temperature", "top_p"]

[targets.cheap]
id = "deepseek-chat"
llm_client = "deepseek"

# Routes: the model name your service sends.

# Cheap model for routine steps; the subscription takes over when the agent
# stalls, loops, or hits errors.
[routes.auto]
id = "switchyard/auto"
type = "stage_router"
capable_target = "claude"
efficient_target = "cheap"
picker = "efficient_first"
confidence_threshold = 0.5

# Same idea with Codex as the strong model.
[routes.auto_codex]
id = "switchyard/auto-codex"
type = "stage_router"
capable_target = "codex"
efficient_target = "cheap"
picker = "efficient_first"
confidence_threshold = 0.5

# Fixed routes, to call one model directly.
[routes.claude]
id = "switchyard/claude"
type = "passthrough"
target = "claude"

[routes.codex]
id = "switchyard/codex"
type = "passthrough"
target = "codex"

[routes.cheap]
id = "switchyard/cheap"
type = "passthrough"
target = "cheap"
