# Switchyard with subscription logins and many API-key providers.
#
# Start it with:
#   DEEPSEEK_API_KEY=... switchyard-server --config examples/multi-provider/switchyard.toml --port 4000
# Then send requests with model = "switchyard/auto".
#
# Every enabled client must have its environment variables set, or the server
# will not start. Uncomment a provider once you have its key.
# Model ids below are examples. Check each provider's model list.

schema_version = 1

# Subscription logins. The server reads and refreshes the CLI's credential file.
# Log in first with `claude` and `codex login`.
# Anthropic's terms allow subscription logins only in Claude Code and its own
# apps. Using one here may get the account blocked.

[llm_clients.claude_subscription]
format = "anthropic_messages"
base_url = "https://api.anthropic.com"
credentials = [
  { claude_code = "~/.claude/.credentials.json" },
  # { claude_code = "~/claude-account2/.credentials.json" },
]

[llm_clients.codex_subscription]
format = "openai_responses"
base_url = "https://chatgpt.com/backend-api/codex"
credentials = [
  { codex = "~/.codex/auth.json" },
  # Log in a second account with: CODEX_HOME=~/.codex-account2 codex login
  # { codex = "~/.codex-account2/auth.json" },
]

# API-key providers. Several keys on one client are used one at a time; a
# rate limit, quota, or auth error moves to the next key.

[llm_clients.deepseek]
format = "openai_chat"
base_url = "https://api.deepseek.com/v1"
credentials = [
  { env = "DEEPSEEK_API_KEY" },
  # { env = "DEEPSEEK_API_KEY_2" },
]

